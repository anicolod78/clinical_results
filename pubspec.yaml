name: clinical_results
description: "Gestione e confronto risultati esami ematici"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.11.1

# Il database viene cifrato per intero, non solo nei singoli campi.
#
# `sqlite3mc` seleziona la build SQLite3 Multiple Ciphers al posto di SQLite
# standard: è l'unica variante disponibile sia come libreria nativa (Android)
# sia come modulo WebAssembly, quindi la cifratura funziona allo stesso modo
# sulle due piattaforme di destinazione.
#
# Nota: `sqlcipher_flutter_libs` non va usato, dalla 0.7.0 è un pacchetto
# vuoto rimasto solo per bloccare le vecchie build script.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Lettura del livello testo dei PDF: quando c'è, è molto più fedele di un
  # riconoscimento ottico.
  syncfusion_flutter_pdf: ^34.2.3

  # Riconoscimento del testo sul dispositivo (Android). Nel browser si usa
  # tesseract.js, caricato da web/index.html.
  google_mlkit_text_recognition: ^0.16.0

  flutter_riverpod: ^2.6.1

  # Archiviazione cifrata. `sqlite3` è dipendenza diretta perché le
  # connessioni applicano il PRAGMA della chiave e verificano che la build in
  # uso supporti davvero la cifratura.
  drift: ^2.34.3
  sqlite3: ^3.5.1
  path_provider: ^2.1.6
  path: ^1.9.1

  # Custodia della chiave dati e derivazione dal PIN.
  flutter_secure_storage: ^11.0.0
  pointycastle: ^4.0.0
  local_auth: ^3.0.2

  # Acquisizione dei documenti.
  #
  # Si usa `file_selector` e non `file_picker`: dalla 12.0 quest'ultimo è un
  # plugin federato che tira dentro `file_picker_linux` -> `dbus` -> `xml ^6`,
  # incompatibile con `xml ^7` richiesto da syncfusion. Un vincolo dovuto a
  # Linux non ha ragione di esistere in un progetto Android/Web.
  image_picker: ^1.2.3
  file_selector: ^1.1.0

  fl_chart: ^1.2.0

  # Versione esatta, non un intervallo: `flutter_localizations` dell SDK
  # dipende da intl 0.20.2 e qualsiasi altra versione blocca la risoluzione.
  intl: 0.20.2
  google_mlkit_document_scanner: ^0.5.0
  rxdart: ^0.28.0

# Icona dell'applicazione, generata da assets/icon/.
#
# Sono due immagini distinte ricavate dallo stesso disegno: quella piena e
# quella per le icone adattive di Android, che ha più margine perché la
# maschera del sistema ritaglia il terzo esterno e il soggetto ne resterebbe
# tagliato.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#2E3A43"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#2E3A43"
    theme_color: "#2E6B8A"

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.15.1
  flutter_launcher_icons: ^0.14.4

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

